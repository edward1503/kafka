<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F72"/></marker><marker id="meta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BC5B21"/></marker></defs>
  <rect width="100%" height="100%" rx="20" fill="#F4F8FA"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#173547">
  <text x="58" y="65" font-size="34" font-weight="700">Partition và replica: hai cách đếm khác nhau</text>
  <text x="58" y="105" font-size="22" fill="#526977">Một topic có 3 partition; replication factor = 3; minh họa trên 3 broker.</text>
  <rect x="58" y="148" width="400" height="433" rx="18" fill="white" stroke="#B9CBD4" stroke-width="2"/><text x="258" y="195" font-size="28" font-weight="700" text-anchor="middle">Broker 1</text><rect x="520" y="148" width="400" height="433" rx="18" fill="white" stroke="#B9CBD4" stroke-width="2"/><text x="720" y="195" font-size="28" font-weight="700" text-anchor="middle">Broker 2</text><rect x="982" y="148" width="400" height="433" rx="18" fill="white" stroke="#B9CBD4" stroke-width="2"/><text x="1182" y="195" font-size="28" font-weight="700" text-anchor="middle">Broker 3</text>
  <rect x="80" y="227" width="356" height="88" rx="12" fill="#087F72"/><text x="258" y="264" font-size="26" font-weight="700" fill="white" text-anchor="middle">P0 · LEADER</text><text x="258" y="296" font-size="20" fill="white" text-anchor="middle">Nhận ghi cho partition này</text><rect x="542" y="227" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="720" y="264" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P0 · FOLLOWER</text><text x="720" y="296" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P0</text><rect x="1004" y="227" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="1182" y="264" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P0 · FOLLOWER</text><text x="1182" y="296" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P0</text><rect x="80" y="342" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="258" y="379" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P1 · FOLLOWER</text><text x="258" y="411" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P1</text><rect x="542" y="342" width="356" height="88" rx="12" fill="#087F72"/><text x="720" y="379" font-size="26" font-weight="700" fill="white" text-anchor="middle">P1 · LEADER</text><text x="720" y="411" font-size="20" fill="white" text-anchor="middle">Nhận ghi cho partition này</text><rect x="1004" y="342" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="1182" y="379" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P1 · FOLLOWER</text><text x="1182" y="411" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P1</text><rect x="80" y="457" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="258" y="494" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P2 · FOLLOWER</text><text x="258" y="526" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P2</text><rect x="542" y="457" width="356" height="88" rx="12" fill="#EAF0F4"/><text x="720" y="494" font-size="26" font-weight="700" fill="#173547" text-anchor="middle">P2 · FOLLOWER</text><text x="720" y="526" font-size="20" fill="#526977" text-anchor="middle">Sao chép log từ leader của P2</text><rect x="1004" y="457" width="356" height="88" rx="12" fill="#087F72"/><text x="1182" y="494" font-size="26" font-weight="700" fill="white" text-anchor="middle">P2 · LEADER</text><text x="1182" y="526" font-size="20" fill="white" text-anchor="middle">Nhận ghi cho partition này</text>
  <text x="720" y="628" font-size="27" font-weight="700" text-anchor="middle">3 partition × 3 replica = 9 bản sao, trong đó có 3 leader</text>
  <text x="720" y="672" font-size="22" text-anchor="middle" fill="#526977">Mỗi partition có một leader và hai follower; các replica của nó nằm trên broker khác nhau.</text>
  <text x="58" y="707" font-size="18" fill="#526977">Sơ đồ minh họa; ISR có thể là một tập con của các replica được gán.</text>
</g></svg>